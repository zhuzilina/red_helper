<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <style>
    :root {
      --primary-color: #8B0000; /* 深红色 */
      --secondary-color: #FF4444; /* 亮红色 */
      --warm-orange: #FF6B6B; /* 暖橙色 */
      --cream-bg: #FFF5F5; /* 浅粉背景 */
    }

    body {
      background-color: var(--cream-bg);
    }

    .team-header {
      background: linear-gradient(135deg, #FFF0F0 0%, #FFE4E1 100%);
      border: 1px solid rgba(139, 0, 0, 0.1);
    }

    .timeline {
      border-left: 3px solid var(--warm-orange);
    }

    .member-card {
      background: rgba(255, 255, 255, 0.9);
      border: 1px solid #FFD6D6;
    }

    .badge.bg-danger {
      background: var(--primary-color)!important;
    }

    .btn-primary {
      background: var(--primary-color);
      border-color: var(--primary-color);
    }

    .btn-primary:hover {
      background: #6B0000;
      border-color: #6B0000;
    }

    .card-header {
      background: rgba(139, 0, 0, 0.05)!important;
      border-bottom: 2px solid var(--warm-orange);
    }

    .text-muted {
      color: #7A4A4A!important; /* 暖灰色 */
    }

    .bi {
      color: var(--primary-color);
    }

    /* 自定义SVG颜色 */
    .bi-car-front-fill {
      fill: var(--primary-color);
    }

    /* 底部按钮渐变 */
    .fixed-bottom .btn-primary {
      background: linear-gradient(45deg, var(--primary-color), var(--warm-orange));
      border: none;
    }

    /* 成员卡片悬停效果 */
    .member-card:hover {
      box-shadow: 0 4px 15px rgba(255, 107, 107, 0.2);
    }
    .btn.signed {
      background: #6B0000 !important;
      border-color: #5A0000 !important;
      cursor: not-allowed;
      opacity: 0.9;
    }

    /* 禁用状态效果 */
    .btn.signed:hover {
      transform: none;
      box-shadow: none;
    }
  </style>
</head>
<body>
<div class="container mt-4">
  <!-- 头部信息 -->
  <div class="team-header p-4 mb-4 position-relative">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h1 class="h3 text-primary mb-0">江姐故居参观组队</h1>
      <span class="badge bg-danger">3/6人</span>
    </div>
    <div class="row g-2 text-muted">
      <div class="col-12 col-md-4">
        <i class="bi bi-calendar"></i> 2024-07-15
      </div>
      <div class="col-12 col-md-4">
        <i class="bi bi-geo-alt"></i> 自贡
      </div>
      <div class="col-12 col-md-4">
        <i class="bi bi-clock-history"></i> 12天
      </div>
    </div>
  </div>

  <div class="row g-4">
    <!-- 主内容 -->
    <div class="col-lg-8">
      <!-- 行程安排 -->
      <div class="card mb-4">
        <div class="card-body">
          <h2 class="h5 mb-4"><i class="bi bi-signpost-split"></i> 行程路线</h2>
          <div class="timeline">
            <div class="mb-4 ps-3">
              <h3 class="h6">Day 1-2：自贡高铁站集合</h3>
              <ul class="list-unstyled">
                <li><i class="me-2"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-car-front-fill" viewBox="0 0 16 16">
                  <path fill-rule="evenodd" d="M2.52 3.515A2.5 2.5 0 0 1 4.82 2h6.362c1 0 1.904.596 2.298 1.515l.792 1.848c.075.175.21.319.38.404.5.25.855.715.965 1.262l.335 1.679c.033.161.049.325.049.49v.413c0 .814-.39 1.543-1 1.997V13.5a.5.5 0 0 1-.5.5h-2a.5.5 0 0 1-.5-.5v-1.338c-1.292.048-2.745.088-4 .088s-2.708-.04-4-.088V13.5a.5.5 0 0 1-.5.5h-2a.5.5 0 0 1-.5-.5v-1.892c-.61-.454-1-1.183-1-1.997v-.413a2.5 2.5 0 0 1 .049-.49l.335-1.68c.11-.546.465-1.012.964-1.261a.807.807 0 0 0 .381-.404l.792-1.848ZM3 10a1 1 0 1 0 0-2 1 1 0 0 0 0 2Zm10 0a1 1 0 1 0 0-2 1 1 0 0 0 0 2ZM6 8a1 1 0 0 0 0 2h4a1 1 0 1 0 0-2H6ZM2.906 5.189l.956-1.913A.5.5 0 0 1 4.309 3h7.382a.5.5 0 0 1 .447.276l.956 1.913a.51.51 0 0 1-.497.731c-.91-.073-3.35-.17-4.597-.17-1.247 0-3.688.097-4.597.17a.51.51 0 0 1-.497-.731Z"/>
                </svg></i>高铁站打车</li>
              </ul>
            </div>
            <!-- 更多天数... -->
          </div>
        </div>
      </div>

      <!-- 费用说明 -->
      <div class="card border-primary">
        <div class="card-header bg-primary bg-opacity-10">
          <h3 class="h5 mb-0"><i class="bi bi-credit-card"></i> 费用明细</h3>
        </div>
        <div class="card-body">
          <div class="row row-cols-2 g-3">
            <div class="col">
              <div class="d-flex justify-content-between">
                <span>打车费用：</span>
                <strong>¥100</strong>
              </div>
            </div>
            <!-- 更多费用项... -->
          </div>
        </div>
      </div>
    </div>

    <!-- 侧边栏 -->
    <div class="col-lg-4">
      <!-- 成员列表 -->
      <div class="card mb-4">
        <div class="card-body">
          <h2 class="h5 mb-3"><i class="bi bi-people-fill"></i> 当前成员</h2>
          <div class="row g-3">
            <div class="col-12">
              <div class="member-card p-3">
                <div class="d-flex align-items-center">
                  <img src="https://picsum.photos/50?random=1" class="rounded-circle me-3" width="50" alt="领队">
                  <div>
                    <h4 class="h6 mb-0">王大山</h4>
                    <small class="text-muted">资深领队</small>
                  </div>
                </div>
              </div>
            </div>
            <!-- 更多成员... -->
          </div>
        </div>
      </div>

      <!-- 快速操作 -->
      <div class="sticky-top" style="top: 1rem;">
        <div class="d-grid gap-2">
          <button class="btn btn-primary">
            <i class="bi bi-chat-dots"></i> 联系组织者
          </button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- 底部报名栏 -->
<div class="fixed-bottom bg-white border-top py-3">
  <div class="container">
    <button class="btn btn-primary w-100 py-3 fs-5">
      <i class="bi bi-pencil-square"></i> 立即报名
    </button>
    <div class="h-500"></div>
  </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
  // 报名功能处理
  document.addEventListener('DOMContentLoaded', function() {
    const signupBtn = document.querySelector('.fixed-bottom .btn-primary');

    signupBtn.addEventListener('click', function() {
      if (!this.classList.contains('signed')) {
        // 修改按钮状态
        this.innerHTML = '<i class="bi bi-check2-circle"></i> 已报名';
        this.classList.remove('btn-primary');
        this.classList.add('btn-secondary', 'signed');

        // 显示提示信息（可选）
        const toast = document.createElement('div');
        toast.className = 'alert alert-success position-fixed top-0 start-50 translate-middle-x mt-3';
        toast.innerHTML = '报名成功！组织者会尽快与您联系';
        document.body.appendChild(toast);

        // 3秒后隐藏提示
        setTimeout(() => toast.remove(), 3000);
      }
    });
  });
</script>
</body>
</html>
