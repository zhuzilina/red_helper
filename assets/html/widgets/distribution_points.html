<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, shrink-to-fit=no">
  <title>响应式积分分布图</title>
  <!-- Bootstrap 核心 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    /* 自定义响应式间距 */
    @media (max-width: 768px) {
      .chart-container {
        padding: 10px !important;
      }
    }
  </style>
</head>
<body class="bg-light">
<!-- 响应式布局容器 -->
<div class="container-fluid py-4">
  <div class="row justify-content-center">
    <div class="col-12 col-md-10 col-lg-8 chart-container">
      <div id="main" class="shadow-lg rounded-3" style="height: 60vh; background: #fff;"></div>
    </div>
  </div>
</div>

<!-- 依赖库 -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.6.0/dist/echarts.min.js"></script>

<script>
  // 防抖函数优化性能[2,3](@ref)
  let resizeTimer;
  const debounceResize = (callback, delay = 200) => {
    return () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(callback, delay);
    }
  };

  // 动态配置生成器[4](@ref)
  const generateOptions = (baseSize) => ({
    tooltip: {
      trigger: 'item',
      textStyle: {
        fontSize: baseSize * 0.9
      }
    },
    legend: {
      top: '5%',
      left: 'center',
      itemWidth: baseSize * 1.2,
      itemHeight: baseSize * 0.8,
      textStyle: {
        fontSize: baseSize * 0.9
      }
    },
    series: [{
      name: '积分分布情况',
      type: 'pie',
      radius: ['40%', '70%'],
      avoidLabelOverlap: false,
      itemStyle: {
        borderRadius: baseSize * 0.3,
        borderColor: '#fff',
        borderWidth: 2
      },
      label: {
        show: false,
        position: 'center',
        fontSize: baseSize
      },
      emphasis: {
        label: {
          show: true,
          fontSize: baseSize * 1.5,
          fontWeight: 'bold'
        }
      },
      labelLine: { show: false },
      data: [
        { value: 1048, name: '运动' },
        { value: 735, name: '旅游' },
        { value: 580, name: '答题' },
        { value: 484, name: '攻略' },
        { value: 300, name: '感想' }
      ]
    }]
  });

  // 初始化图表[1,6](@ref)
  let myChart;
  const initChart = () => {
    const chartDom = document.getElementById('main');
    myChart = echarts.init(chartDom);

    // 根据窗口宽度计算基准尺寸[4](@ref)
    const baseSize = Math.min(
            Math.max(12, window.innerWidth / 38),
            window.innerHeight / 25
    );

    myChart.setOption(generateOptions(baseSize));
    myChart.resize();
  };

  // 响应式处理[3,8](@ref)
  const handleResize = () => {
    if (myChart && !myChart.isDisposed()) {
      myChart.resize();
      initChart(); // 重新生成配置
    }
  };

  // 事件监听[2,3](@ref)
  window.addEventListener('resize', debounceResize(handleResize));
  document.addEventListener('DOMContentLoaded', initChart);
</script>
</body>
</html>
